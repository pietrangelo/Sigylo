[package]
name = "sigylo-relay"
description = "Cloudflare Worker shell: the blind relay. HTTP in, Custody use cases, PostgreSQL via Hyperdrive out"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[package.metadata.rosette]
role = "shell"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
custody.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"

[target.'cfg(target_arch = "wasm32")'.dependencies]
custody-adapters.workspace = true
worker = { version = "0.8.7", features = ["tokio-postgres"] }
tokio-postgres = { version = "0.7.18", default-features = false, features = ["js"] }
wasm-bindgen-futures = "0.4"
getrandom = { version = "0.4.3", features = ["wasm_js"] }

[lints]
workspace = true
