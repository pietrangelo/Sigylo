[package]
name = "sigylo-relay"
description = "Cloudflare Worker shell: the blind relay. HTTP in, Custody and Access use cases, the vault and the accounts in Durable Objects and R2 out"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[package.metadata.rosette]
role = "shell"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
access.workspace = true
custody.workspace = true
vault.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"

[target.'cfg(target_arch = "wasm32")'.dependencies]
access-adapters.workspace = true
custody-adapters.workspace = true
vault-adapters.workspace = true
worker = "0.8.7"
wasm-bindgen = "0.2"
getrandom = { version = "0.4.3", features = ["wasm_js"] }
zeroize.workspace = true

[lints]
workspace = true
