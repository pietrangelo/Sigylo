# Sigylo relay + web client on one origin (Workers Static Assets).
name = "sigylo"
main = "build/worker/shim.mjs"
compatibility_date = "2026-10-01"

# Production origin. The zone lives in the same Cloudflare account; wrangler creates
# the DNS record and certificate on deploy. workers.dev stays off: one origin only.
routes = [{ pattern = "sigylo.net", custom_domain = true }]
workers_dev = false

[build]
command = "cargo install -q worker-build@0.8.7 --locked && worker-build --release"

# The Svelte client (web/dist) is served as static assets; only /api/* runs the Worker.
[assets]
directory = "../web/dist"
run_worker_first = ["/api/*"]
not_found_handling = "single-page-application"

# PostgreSQL (Supabase) through Hyperdrive. Create it with caching disabled:
#   npx wrangler hyperdrive create sigylo-db --caching-disabled --connection-string="postgres://sigylo_relay:<password>@<host>:5432/postgres"
# then paste its id here. A cached `custody.open` would hand out a burned,
# revoked or expired secret again (CLAUDE.md §4). The local connection string
# is used by `wrangler dev`.
[[hyperdrive]]
binding = "DB"
id = "c9378333c78c410c8ceffd9b7e19488f"
localConnectionString = "postgres://sigylo_relay:relay-test-only@127.0.0.1:55432/postgres"

# The sealed chunks of files (opaque ciphertext under random names), in the EU.
# Create the bucket once:  npx wrangler r2 bucket create sigylo-chunks --jurisdiction eu
# The scheduled run below deletes the objects of burned, revoked and expired chunks;
# as a backstop the bucket also gets a lifecycle rule:
#   npx wrangler r2 bucket lifecycle add sigylo-chunks backstop --expire-days 8 --jurisdiction eu
[[r2_buckets]]
binding = "CHUNKS"
bucket_name = "sigylo-chunks"
jurisdiction = "eu"

# Sigylo's vault: one Durable Object, created by name in the EU jurisdiction
# (vault_adapters::DurableLink), keeps every record of custody in its own
# storage; the sealed bytes, payloads and chunks alike, stay in R2 above, so a
# burned secret does not survive in the Durable Object's 30-day history. The
# class runs in this same Worker; only this Worker reaches it.
[[durable_objects.bindings]]
name = "VAULT"
class_name = "SigyloVault"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SigyloVault"]

# Throttle every API call per client address, IPv6 by /64 (kept in memory by
# Cloudflare, never stored by us): POSTs and GETs each have their own allowance.
[[ratelimits]]
name = "WRITE_LIMITER"
namespace_id = "7301"
simple = { limit = 30, period = 60 }

[[ratelimits]]
name = "READ_LIMITER"
namespace_id = "7303"
simple = { limit = 60, period = 60 }

# Throttles login attempts per account, from any address, so a botnet cannot
# guess one account's password at leisure. Keyed by a prefix of the account's
# keyed hash; nothing is stored by us.
[[ratelimits]]
name = "LOGIN_LIMITER"
namespace_id = "7302"
simple = { limit = 10, period = 60 }

# The relay's OPAQUE keys derive from the secret OPAQUE_SERVER_SEED (32 random
# bytes, base64url). The deploy workflow creates it once if it is missing;
# changing it afterwards locks every account out.
#
# OPAQUE_CANARY is the secret's public fingerprint, as GET /api/account/canary
# reports it. Once it is set, account routes answer 503 under any other secret,
# and the deploy refuses to create a new one or to finish with a different one.
# Recorded from the live relay on 2026-10-18. Empty would mean not recorded yet,
# and the deploy would print the live value to paste here.
#
# LEGACY_VAULT = "drain": custody kept in the database before the vault is still
# opened, revoked, answered and purged there (nothing new goes in), until the
# last of it expires, at most 7 days after the vault went live.
[vars]
LEGACY_VAULT = "drain"
OPAQUE_CANARY = "zZ3ImAHoqehSoothI6rrvwLTwKyYLznXA995E4QyYnU"

# Physically delete expired records (reads already ignore them), in the vault and,
# while it drains, in the database, then the R2 objects of everything that went.
[triggers]
crons = ["*/15 * * * *"]

[observability]
enabled = false
