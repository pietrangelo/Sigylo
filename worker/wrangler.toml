# Sigylo relay + web client on one origin (Workers Static Assets).
name = "sigylo"
main = "build/worker/shim.mjs"
compatibility_date = "2026-10-01"

# Production origin. The zone lives in the same Cloudflare account; wrangler creates
# the DNS record and certificate on deploy. workers.dev stays off: one origin only.
routes = [{ pattern = "sigylo.net", custom_domain = true }]
workers_dev = false

[build]
command = "cargo install -q worker-build@0.8.7 --locked && worker-build --release"

# The Svelte client (web/dist) is served as static assets; only /api/* runs the Worker.
[assets]
directory = "../web/dist"
run_worker_first = ["/api/*"]
not_found_handling = "single-page-application"

# PostgreSQL (Supabase) through Hyperdrive. Create it with caching disabled:
#   npx wrangler hyperdrive create sigylo-db --caching-disabled --connection-string="postgres://sigylo_relay:<password>@<host>:5432/postgres"
# then paste its id here. A cached `custody.open` would hand out a burned,
# revoked or expired secret again (CLAUDE.md §4). The local connection string
# is used by `wrangler dev`.
[[hyperdrive]]
binding = "DB"
id = "c9378333c78c410c8ceffd9b7e19488f"
localConnectionString = "postgres://sigylo_relay:relay-test-only@127.0.0.1:55432/postgres"

# Throttles POSTs per client address (kept in memory by Cloudflare, never stored by us).
[[ratelimits]]
name = "WRITE_LIMITER"
namespace_id = "7301"
simple = { limit = 30, period = 60 }

# Throttles login attempts per account, from any address, so a botnet cannot
# guess one account's password at leisure. Keyed by a prefix of the account's
# keyed hash; nothing is stored by us.
[[ratelimits]]
name = "LOGIN_LIMITER"
namespace_id = "7302"
simple = { limit = 10, period = 60 }

# The relay's OPAQUE keys derive from the secret OPAQUE_SERVER_SEED (32 random
# bytes, base64url). The deploy workflow creates it once if it is missing;
# changing it afterwards locks every account out.

# Physically delete expired rows (reads already ignore them).
[triggers]
crons = ["*/15 * * * *"]

[observability]
enabled = false
