[package]
name = "sigylo-app"
description = "Tauri shell: the web client and its Wasm engine bundled in an installable app that talks only to the sigylo.net relay"
version = "0.1.1"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/pietrangelo/Sigylo"
rust-version = "1.88"
publish = false

[package.metadata.rosette]
role = "shell"

# The app is its own workspace (excluded from the root one): it needs the
# system webview libraries and the built web client, which the domains,
# adapters and relay never need. The architecture guard still checks it.
[workspace]

[lib]
name = "sigylo_app"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
tauri = { version = "2.12.4", features = [] }
tauri-plugin-opener = "2.7.2"
base64 = "0.22.1"
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls"] }
serde = { version = "1", features = ["derive"] }
url = "2.5.8"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util"] }
serde_json = "1"

[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
