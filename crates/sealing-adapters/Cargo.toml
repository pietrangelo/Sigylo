[package]
name = "sealing-adapters"
description = "RustCrypto implementations of the Sealing ports: X25519 + ML-KEM-768, Ed25519 + ML-DSA-65, XChaCha20-Poly1305, Argon2id, HKDF-SHA3-256"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
sealing.workspace = true
zeroize.workspace = true
ml-kem = { version = "0.3.2", features = ["hazmat", "zeroize"] }
x25519-dalek = { version = "3.0.0", features = ["static_secrets", "zeroize"] }
ed25519-dalek = { version = "3.0.0", default-features = false, features = ["zeroize"] }
ml-dsa = { version = "0.1.1", default-features = false, features = ["alloc", "zeroize"] }
chacha20poly1305 = { version = "0.11.0", features = ["zeroize"] }
hkdf = "0.13.0"
sha3 = { version = "0.11.0", features = ["zeroize"] }
argon2 = { version = "0.6.0", default-features = false, features = ["alloc", "zeroize"] }
getrandom = "0.4.3"
# Not used directly: declared so the hash states inside ed25519-dalek (SHA-512),
# ml-dsa (SHAKE256) and argon2 (BLAKE2b) are wiped on drop (tests/zeroize_features.rs).
sha2 = { version = "0.11.1", default-features = false, features = ["zeroize"] }
shake = { version = "0.1.0", default-features = false, features = ["zeroize"] }
blake2 = { version = "0.11.0", default-features = false, features = ["zeroize"] }

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
getrandom = { version = "0.4.3", features = ["wasm_js"] }

[dev-dependencies]
# Test-only allocator that checks the Argon2id memory is wiped before it is freed.
heap-probe.workspace = true

[lints]
workspace = true

[package.metadata.rosette]
role = "adapters"
