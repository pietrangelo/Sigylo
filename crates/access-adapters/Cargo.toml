[package]
name = "access-adapters"
description = "Adapters for the Access ports: OPAQUE (opaque-ke, ristretto255 + SHA-512 + Argon2id) for relay and device, HKDF keyring key, random tokens, and the PostgreSQL account store"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
# The account store on PostgreSQL. Only the relay needs it; the browser does not.
postgres = ["dep:tokio-postgres"]

[dependencies]
access.workspace = true
zeroize.workspace = true
opaque-ke = { version = "4.0.1", default-features = false, features = ["ristretto255"] }
argon2 = { version = "0.6.0", default-features = false, features = ["alloc", "zeroize"] }
sha2 = "0.10.9"
hmac = "0.12.1"
hkdf = "0.12.4"
rand_chacha = "0.3.1"
getrandom = "0.4.3"
tokio-postgres = { version = "0.7.18", default-features = false, optional = true }

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
getrandom = { version = "0.4.3", features = ["wasm_js"] }

[dev-dependencies]
tokio-postgres = { version = "0.7.18" }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
futures-util = "0.3"

[lints]
workspace = true

[package.metadata.rosette]
role = "adapters"
