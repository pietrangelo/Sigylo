[package]
name = "access-adapters"
description = "Adapters for the Access ports: OPAQUE (opaque-ke, ristretto255 + SHA-512 + Argon2id) for relay and device, HKDF keyring key, random tokens, device passes and throttle buckets"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
access.workspace = true
zeroize.workspace = true
opaque-ke = { version = "4.0.1", default-features = false, features = ["ristretto255"] }
argon2 = { version = "0.6.0", default-features = false, features = ["alloc", "zeroize"] }
sha2 = "0.10.9"
hmac = "0.12.1"
hkdf = "0.12.4"
chacha20poly1305 = { version = "0.11.0", features = ["zeroize"] }
rand_chacha = "0.3.1"
getrandom = "0.4.3"

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
getrandom = { version = "0.4.3", features = ["wasm_js"] }

[dev-dependencies]
# The account contract suite runs on the vault: domains only, never linked into the crate.
vault.workspace = true
custody.workspace = true
futures-util = "0.3"
# Test-only allocator that checks the Argon2id memory is wiped before it is freed.
heap-probe.workspace = true

[lints]
workspace = true

[package.metadata.rosette]
role = "adapters"
