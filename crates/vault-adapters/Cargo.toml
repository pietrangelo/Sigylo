[package]
name = "vault-adapters"
description = "Adapters for the Vault ports on Cloudflare: a Durable Object's synchronous storage, the payloads in R2, the link from the relay to its Durable Object, the Worker's clock"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
custody.workspace = true
vault.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
worker = "0.8.7"
wasm-bindgen = "0.2"
js-sys = "0.3"

[lints]
workspace = true

[package.metadata.rosette]
role = "adapters"
