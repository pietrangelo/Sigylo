[package]
name = "custody-adapters"
description = "Adapters for the Custody ports: PostgreSQL vault (tokio-postgres, works over Cloudflare Hyperdrive) and SHA-256 token digest"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
custody.workspace = true
tokio-postgres = { version = "0.7.18", default-features = false }
sha2 = "0.11.1"

[dev-dependencies]
tokio-postgres = { version = "0.7.18" }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
futures-util = "0.3"
getrandom = "0.4.3"

[lints]
workspace = true

[package.metadata.rosette]
role = "adapters"
