[workspace]
resolver = "3"
members = ["crates/sealing", "crates/sealing-adapters", "crates/custody", "crates/custody-adapters", "crates/vault", "crates/vault-adapters", "crates/access", "crates/access-adapters", "crates/sigylo-wasm", "worker", "tools/architecture-guard", "tools/heap-probe"]
# The Tauri app is its own workspace (it needs the system webview); the guard checks it too.
exclude = ["app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/pietrangelo/Sigylo"
rust-version = "1.88"

[workspace.dependencies]
sealing = { path = "crates/sealing" }
sealing-adapters = { path = "crates/sealing-adapters" }
custody = { path = "crates/custody" }
custody-adapters = { path = "crates/custody-adapters" }
vault = { path = "crates/vault" }
vault-adapters = { path = "crates/vault-adapters" }
access = { path = "crates/access" }
access-adapters = { path = "crates/access-adapters" }
heap-probe = { path = "tools/heap-probe" }
zeroize = { version = "1.9.1", features = ["derive"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"

[profile.dev.package."*"]
opt-level = 3
