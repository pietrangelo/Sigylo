name: Deploy

# Publishes https://sigylo.net from main, and only after CI passed on that exact
# commit. Pull requests never run this workflow, and the token is a secret of
# the `production` environment, open to main only (CLAUDE.md §6), so no branch
# or fork ever sees it. Secrets: CLOUDFLARE_API_TOKEN ("Edit Cloudflare
# Workers", scoped to this account and the sigylo.net zone) and
# CLOUDFLARE_ACCOUNT_ID.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  WASM_BINDGEN_VERSION: 0.2.129
  WORKER_BUILD_VERSION: 0.8.7
  WRANGLER_VERSION: 4.151.1

jobs:
  deploy:
    name: Deploy to sigylo.net
    # `event == 'push'` matters: a pull request from a fork whose branch is also
    # called main would otherwise pass the branch filter above.
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-24.04
    # The Cloudflare secrets live in this environment, which only main may
    # use: a workflow pushed on any other branch, or this one dispatched from
    # there, never sees them.
    environment: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      # CI runs finish in any order: an older commit must never replace a newer
      # one, which may carry a security fix.
      - name: This commit is still the tip of main
        env:
          COMMIT: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          tip="$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}" refs/heads/main | cut -f1)"
          if [[ "$tip" != "$COMMIT" ]]; then
            echo "::error::main moved on to $tip; its own run deploys it"
            exit 1
          fi
      - name: Hyperdrive is configured
        run: |
          if grep -Eq '^id = "0{32}"' worker/wrangler.toml; then
            echo "::error file=worker/wrangler.toml::the Hyperdrive id is still the placeholder (CLAUDE.md §6)"
            exit 1
          fi
      # The switches for the local runtime only (scripts/e2e.sh passes them to
      # wrangler dev) never ship: production keeps TLS and the EU vault.
      - name: No local-only switch
        run: |
          if grep -Eq '^(DB_TLS|VAULT_PLACEMENT) *=' worker/wrangler.toml; then
            echo "::error file=worker/wrangler.toml::DB_TLS and VAULT_PLACEMENT are for wrangler dev only"
            exit 1
          fi
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2
        with:
          tool: wasm-bindgen@${{ env.WASM_BINDGEN_VERSION }}
      - run: cargo install worker-build@${{ env.WORKER_BUILD_VERSION }} --locked
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci && npm run build
        working-directory: web
      - name: Deploy
        run: npx --yes wrangler@${{ env.WRANGLER_VERSION }} deploy
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # The relay's OPAQUE keys derive from this secret (CLAUDE.md §3-bis). It is
      # made once, on the runner, straight into Cloudflare, and never printed.
      # It is never replaced: a new one would lock every account out. If the
      # list cannot be read, the step fails rather than risk making a second
      # one; once OPAQUE_CANARY in wrangler.toml records the secret, a missing
      # secret fails the deploy too, since only the lost one can serve the
      # accounts.
      - name: The OPAQUE secret exists
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          names="$(npx --yes wrangler@${{ env.WRANGLER_VERSION }} secret list --format json | jq -r '.[].name')"
          if ! grep -qx OPAQUE_SERVER_SEED <<<"$names"; then
            if [[ -n "$(sed -n 's/^OPAQUE_CANARY = "\(.*\)"$/\1/p' wrangler.toml)" ]]; then
              echo "::error file=worker/wrangler.toml::OPAQUE_SERVER_SEED is gone but OPAQUE_CANARY records it: a new secret would lock every account out. Restore it, or empty OPAQUE_CANARY to start over on purpose."
              exit 1
            fi
            openssl rand 32 | basenc --base64url | tr -d '=\n' \
              | npx --yes wrangler@${{ env.WRANGLER_VERSION }} secret put OPAQUE_SERVER_SEED
          fi
      # Rocket Loader, Email Obfuscation or an analytics beacon would rewrite the
      # page and break CSP and SRI (CLAUDE.md §6): the zone must serve the page
      # byte for byte as built, with the policy from _headers. A new custom
      # domain can take a few minutes to get its certificate.
      - name: The zone serves the page exactly as built
        run: |
          for attempt in $(seq 30); do
            curl -fsS https://sigylo.net/ -o served.html && cmp -s served.html web/dist/index.html && break
            sleep 10
          done
          cmp served.html web/dist/index.html
          policy="$(sed -n 's/^  Content-Security-Policy: //p' web/public/_headers)"
          curl -fsS -D - -o /dev/null https://sigylo.net/ | tr -d '\r' | grep -iF "content-security-policy: $policy"
      # The secret serving accounts is the one they were made with. Its public
      # canary is compared with OPAQUE_CANARY; until that is recorded, the live
      # value is printed to be pasted into wrangler.toml.
      - name: Accounts run on the secret they were made with
        run: |
          set -euo pipefail
          live="$(curl -fsS https://sigylo.net/api/account/canary | jq -er .canary)"
          expected="$(sed -n 's/^OPAQUE_CANARY = "\(.*\)"$/\1/p' worker/wrangler.toml)"
          if [[ -z "$expected" ]]; then
            echo "::warning file=worker/wrangler.toml::OPAQUE_CANARY is not recorded yet; set it to \"$live\""
          elif [[ "$live" != "$expected" ]]; then
            echo "::error file=worker/wrangler.toml::the live OPAQUE secret is not the one accounts were made with (canary $live, expected $expected)"
            exit 1
          fi
