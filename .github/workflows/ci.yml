name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  WASM_BINDGEN_VERSION: 0.2.129
  WORKER_BUILD_VERSION: 0.8.7
  TAURI_DRIVER_VERSION: 2.1.0

jobs:
  rust:
    name: Rust (fmt, clippy, guard, tests)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      # A moved tag of a third-party action would run in the deploy job, next to
      # the Cloudflare token and the page about to be published (CLAUDE.md §6).
      # The workflows are parsed, so no spelling of `uses` slips through.
      - name: Every action is pinned to a commit
        run: |
          set -euo pipefail
          python3 -I scripts/check-pins.py .github/workflows
          good="$(mktemp -d)"
          printf 'jobs:\n  a:\n    uses: ./.github/workflows/w.yml\n  b:\n    steps:\n      - uses: actions/checkout@%s # v4\n      - uses: ./local\n      - uses: docker://alpine@sha256:%s\n' \
            11d5960a326750d5838078e36cf38b85af677262 "$(printf 'a%.0s' $(seq 64))" > "$good/good.yml"
          python3 -I scripts/check-pins.py "$good"
          bad() { mkdir "$1"; printf "$2" > "$1/$3"; }
          dir="$(mktemp -d)"
          bad "$dir/quoted" 'jobs:\n  a:\n    steps:\n      - "uses": actions/checkout@v4\n' w.yml
          bad "$dir/flow" 'jobs: {a: {steps: [{uses: actions/checkout@v4}]}}\n' w.yml
          bad "$dir/yaml" 'jobs:\n  a:\n    steps:\n      - uses: actions/checkout@v4\n' w.yaml
          bad "$dir/reusable" 'jobs:\n  a:\n    uses: owner/repo/.github/workflows/w.yml@v1\n' w.yml
          bad "$dir/short" 'jobs:\n  a:\n    steps:\n      - uses: actions/checkout@11d5960\n' w.yml
          bad "$dir/branch" 'jobs:\n  a:\n    steps:\n      - uses: actions/checkout@main\n' w.yml
          bad "$dir/docker" 'jobs:\n  a:\n    steps:\n      - uses: docker://alpine:3\n' w.yml
          bad "$dir/climb" 'jobs:\n  a:\n    steps:\n      - uses: ./../elsewhere\n' w.yml
          bad "$dir/anchor" 'x: &u actions/checkout@v4\njobs:\n  a:\n    steps:\n      - uses: *u\n' w.yml
          bad "$dir/unparsable" 'jobs: [\n' w.yml
          for fixture in "$dir"/*; do
            if python3 -I scripts/check-pins.py "$fixture" > /dev/null; then
              echo "::error::scripts/check-pins.py missed $(basename "$fixture")"
              exit 1
            fi
          done
      # The jobs that hold a credential (the Cloudflare token, a secret, a
      # write permission) build nothing and run no install script; no workflow
      # writes as a whole (CLAUDE.md §5, §6). The fixtures spell an expression
      # as $%s{{ and the context as secret%ss, so that GitHub evaluates nothing
      # here and this file does not trip the check.
      - name: Credentials never sit next to a build
        run: |
          set -euo pipefail
          python3 -I scripts/check-workflows.py .github/workflows
          head='permissions:\n  contents: read\njobs:\n  d:\n    environment: production\n    steps:\n'
          bad() { mkdir "$1"; printf "$2" > "$1/w.yml"; }
          dir="$(mktemp -d)"
          bad "$dir/write-all" 'permissions: write-all\njobs:\n  a:\n    steps: []\n'
          bad "$dir/no-permissions" 'jobs:\n  a:\n    steps: []\n'
          bad "$dir/job-writes" 'permissions:\n  contents: read\njobs:\n  a:\n    permissions:\n      contents: write\n    steps: []\n'
          bad "$dir/cargo" "$head"'      - run: cargo build --release\n'
          bad "$dir/npm-scripts" "$head"'      - run: npm ci\n'
          bad "$dir/npm-run" "$head"'      - run: npm ci --ignore-scripts && npm run build\n'
          bad "$dir/npx" "$head"'      - run: np%sx wrangler deploy\n'
          bad "$dir/action" "$head"'      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec\n'
          bad "$dir/npm-cache" "$head"'      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020\n        with:\n          cache: npm\n'
          bad "$dir/secret" 'permissions:\n  contents: read\njobs:\n  b:\n    steps:\n      - run: worker-build --release\n        env:\n          TOKEN: secret%ss.TOKEN\n'
          bad "$dir/workflow-env" 'permissions:\n  contents: read\nenv:\n  TOKEN: $%s{{ secret%ss.TOKEN }}\njobs:\n  b:\n    steps:\n      - run: cargo build --release\n'
          bad "$dir/secret-index" 'permissions:\n  contents: read\njobs:\n  b:\n    steps:\n      - run: worker-build --release\n        env:\n          TOKEN: $%s{{ secret%ss[\047TOKEN\047] }}\n'
          bad "$dir/secret-json" 'permissions:\n  contents: read\njobs:\n  b:\n    steps:\n      - run: worker-build --release\n        env:\n          ALL: $%s{{ toJSON(secret%ss) }}\n'
          bad "$dir/reusable" 'permissions:\n  contents: read\njobs:\n  d:\n    environment: production\n    uses: ./.github/workflows/w.yml\n'
          for fixture in "$dir"/*; do
            if python3 -I scripts/check-workflows.py "$fixture" > /dev/null; then
              echo "::error::scripts/check-workflows.py missed $(basename "$fixture")"
              exit 1
            fi
          done
      # Wrangler is an exact dev dependency of worker/, installed from its lock
      # file with every integrity checked, never fetched on the fly (CLAUDE.md §6).
      # The fixtures spell npx as np%sx so that this file does not trip the check.
      - name: npm runs only what a lock pins
        run: |
          set -euo pipefail
          python3 -I scripts/check-npm.py --lock worker/package-lock.json --lock web/package-lock.json \
            .github/workflows/*.y*ml scripts/*
          dir="$(mktemp -d)"
          printf '{"lockfileVersion": 3, "packages": {"": {}, "node_modules/a": {"version": "1.0.0", "resolved": "https://registry.npmjs.org/a/-/a-1.0.0.tgz"}}}' > "$dir/no-integrity.json"
          printf '{"lockfileVersion": 3, "packages": {"": {}, "node_modules/a": {"version": "1.0.0", "resolved": "https://evil.example/a.tgz", "integrity": "sha512-AAAA"}}}' > "$dir/elsewhere.json"
          printf '{"lockfileVersion": 3, "packages": {"": {}, "node_modules/a": {"version": "1.0.0", "resolved": "https://registry.npmjs.org/a/-/a-1.0.0.tgz", "integrity": "sha1-AAAA"}}}' > "$dir/sha1.json"
          printf '{"lockfileVersion": 3, "packages": {"": {}, "node_modules/a": {"link": true, "resolved": "../a"}}}' > "$dir/link.json"
          printf '{"lockfileVersion": 1, "dependencies": {}}' > "$dir/old.json"
          for lock in "$dir"/*.json "$dir/missing.json"; do
            if python3 -I scripts/check-npm.py --lock "$lock" > /dev/null; then
              echo "::error::scripts/check-npm.py missed $(basename "$lock")"
              exit 1
            fi
          done
          printf 'run: np%sx --yes wrangler deploy\n' "" > "$dir/yes.yml"
          printf 'run: np%sx -y cowsay\n' "" > "$dir/y.sh"
          printf 'run: np%sx wrangler@4.151.1 deploy\n' "" > "$dir/versioned.yml"
          printf '  np%sx wrangler deploy\n' "" > "$dir/unpinned.sh"
          printf 'np%sx --no-install wrangler whoami && np%sx wrangler deploy\n' "" "" > "$dir/chained.sh"
          for file in "$dir"/*.yml "$dir"/*.sh; do
            if python3 -I scripts/check-npm.py --lock worker/package-lock.json "$file" > /dev/null; then
              echo "::error::scripts/check-npm.py missed $(basename "$file")"
              exit 1
            fi
          done
      # The deploy publishes wrangler.toml without its [build] table, generated
      # on the spot: the generator refuses a build it cannot take out whole.
      - name: The deploy configuration builds nothing
        run: |
          set -euo pipefail
          dir="$(mktemp -d)"
          python3 -I scripts/deploy-config.py worker/wrangler.toml "$dir/deploy.toml"
          python3 -I scripts/local-switches.py "$dir/deploy.toml"
          printf 'name = "x"\nbuild.command = "make"\n' > "$dir/dotted.toml"
          printf 'name = "x"\nbuild = { command = "make" }\n' > "$dir/inline.toml"
          printf '[build]\ncommand = "a"\n[env.staging.build]\ncommand = "b"\n' > "$dir/env.toml"
          printf '[build]\ncommand = "a"\n[build.upload]\nformat = "x"\n' > "$dir/subtable.toml"
          printf '[build]\ncommand = """\n[vars]\nX = 1\n"""\n' > "$dir/multiline.toml"
          for bad in dotted inline env subtable multiline; do
            if python3 -I scripts/deploy-config.py "$dir/$bad.toml" "$dir/out.toml" > /dev/null; then
              echo "::error::scripts/deploy-config.py missed $bad.toml"
              exit 1
            fi
          done
      # The deploy refuses the local-only switches, and anything of the database
      # that is gone, however they are spelled.
      - name: The local-only switch check sees every spelling
        run: |
          set -euo pipefail
          python3 scripts/local-switches.py worker/wrangler.toml
          dir="$(mktemp -d)"
          printf '[vars]\n  DB_TLS = "disable"\n' > "$dir/indented.toml"
          printf '[vars]\n"VAULT_PLACEMENT" = "local"\n' > "$dir/quoted.toml"
          printf 'vars.DB_TLS = "disable"\n' > "$dir/dotted.toml"
          printf '[env.staging.vars]\nVAULT_PLACEMENT = "local"\n' > "$dir/nested.toml"
          printf '[vars]\nLEGACY_VAULT = "drain"\n' > "$dir/drain.toml"
          printf '[[hyperdrive]]\nbinding = "DB"\nid = "x"\n' > "$dir/hyperdrive.toml"
          printf '[[env.staging.hyperdrive]]\nbinding = "DB"\n' > "$dir/nested-hyperdrive.toml"
          printf 'hyperdrive = [{ binding = "DB", id = "x" }]\n' > "$dir/inline-hyperdrive.toml"
          for bad in "$dir"/*.toml; do
            if python3 scripts/local-switches.py "$bad" > /dev/null; then
              echo "::error::scripts/local-switches.py missed $(basename "$bad")"
              exit 1
            fi
          done
      - run: cargo fmt --all --check
      # --locked: what is built is what Cargo.lock says, and the deploy builds the same.
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo clippy -p sigylo-relay -p sigylo-wasm --target wasm32-unknown-unknown -- -D warnings
      - name: Architecture guard
        run: cargo run -p architecture-guard
      - run: cargo test --workspace --locked
      - name: Wasm builds
        run: cargo build -p sigylo-wasm -p sigylo-relay --target wasm32-unknown-unknown --release

  web:
    name: Web (types, unit tests, build)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2
        with:
          tool: wasm-bindgen@${{ env.WASM_BINDGEN_VERSION }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: npm run check
        working-directory: web
      - run: npm test
        working-directory: web

  e2e:
    name: End-to-end (Worker + vault + Chromium)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2
        with:
          tool: wasm-bindgen@${{ env.WASM_BINDGEN_VERSION }}
      - run: cargo install worker-build@${{ env.WORKER_BUILD_VERSION }} --locked
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            worker/package-lock.json
      - run: npm ci && npx playwright install --with-deps chromium
        working-directory: web
      - run: bash scripts/e2e.sh

  app:
    name: App (Tauri shell + smoke test in the real webview)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: System webview and virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential file libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev xvfb webkit2gtk-driver
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: |
            . -> target
            app -> target
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2
        with:
          tool: wasm-bindgen@${{ env.WASM_BINDGEN_VERSION }}
      - run: cargo install tauri-driver@${{ env.TAURI_DRIVER_VERSION }} --locked
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci && npm run build:app
        working-directory: web
      - run: cargo fmt --check
        working-directory: app
      # --locked: built from app/Cargo.lock as committed, like the release.
      - run: cargo clippy --all-targets --locked -- -D warnings
        working-directory: app
      - run: cargo test --locked
        working-directory: app
      - run: bash scripts/app-smoke.sh
