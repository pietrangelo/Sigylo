name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  WASM_BINDGEN_VERSION: 0.2.129
  WORKER_BUILD_VERSION: 0.8.7
  TAURI_DRIVER_VERSION: 2.1.0

jobs:
  rust:
    name: Rust (fmt, clippy, guard, tests)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      # A moved tag of a third-party action would run in the deploy job, next to
      # the Cloudflare token and the page about to be published (CLAUDE.md §6).
      - name: Every action is pinned to a commit
        run: |
          if grep -nE '^\s*(- )?uses: ' .github/workflows/*.yml | grep -vE 'uses: [^@ ]+@[0-9a-f]{40} # '; then
            echo "::error::pin these actions to a full commit SHA, with the tag in a comment"
            exit 1
          fi
      # tauri-action creates the draft release only with this token: without it
      # every build of a tag ends in "GITHUB_TOKEN is required".
      - name: The app release can publish
        run: |
          if ! grep -qE '^\s+GITHUB_TOKEN: \$\{\{ secrets\.GITHUB_TOKEN \}\}$' .github/workflows/app-release.yml; then
            echo "::error::app-release.yml must pass GITHUB_TOKEN to tauri-action"
            exit 1
          fi
      - run: cargo fmt --all --check
      # --locked: what is built is what Cargo.lock says, and the deploy builds the same.
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo clippy -p sigylo-relay -p sigylo-wasm --target wasm32-unknown-unknown -- -D warnings
      - name: Architecture guard
        run: cargo run -p architecture-guard
      - run: cargo test --workspace --locked
      - name: Wasm builds
        run: cargo build -p sigylo-wasm -p sigylo-relay --target wasm32-unknown-unknown --release

  database:
    name: PostgreSQL (privileges + vault contract)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      SIGYLO_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: bash supabase/tests/run.sh

  web:
    name: Web (types, unit tests, build)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2
        with:
          tool: wasm-bindgen@${{ env.WASM_BINDGEN_VERSION }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: npm run check
        working-directory: web
      - run: npm test
        working-directory: web

  e2e:
    name: End-to-end (Worker + PostgreSQL + Chromium)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2
        with:
          tool: wasm-bindgen@${{ env.WASM_BINDGEN_VERSION }}
      - run: cargo install worker-build@${{ env.WORKER_BUILD_VERSION }} --locked
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci && npx playwright install --with-deps chromium
        working-directory: web
      - run: bash scripts/e2e.sh

  app:
    name: App (Tauri shell + smoke test in the real webview)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: System webview and virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential file libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev xvfb webkit2gtk-driver
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: |
            . -> target
            app -> target
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2
        with:
          tool: wasm-bindgen@${{ env.WASM_BINDGEN_VERSION }}
      - run: cargo install tauri-driver@${{ env.TAURI_DRIVER_VERSION }} --locked
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci && npm run build:app
        working-directory: web
      - run: cargo fmt --check
        working-directory: app
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: app
      - run: cargo test
        working-directory: app
      - run: bash scripts/app-smoke.sh
